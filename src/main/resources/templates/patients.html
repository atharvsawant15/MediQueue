
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Directory | MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #123b63;
        }

        .main-container {
            margin-top: 40px;
        }

        .table-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .table thead {
            background: #eaf1f8;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            MediQueue
        </a>

        <a th:href="@{/patients/register}"
           class="btn btn-light btn-sm">
            + Register Patient
        </a>
    </div>
</nav>

<div class="container main-container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">Patient Directory</h2>
            <p class="text-muted">
                Manage registered patients
            </p>
        </div>

        <a th:href="@{/patients/register}"
           class="btn btn-primary">
            Add Patient
        </a>

    </div>

    <div th:if="${param.success}"
         class="alert alert-success">
        Patient registered successfully!
    </div>

    <div class="card table-card">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Code</th>
                        <th>Full Name</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Email</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="patient : ${patients}">

                        <td th:text="${patient.id}"></td>

                        <td>
                            <span class="badge bg-primary"
                                  th:text="${patient.patientCode}">
                            </span>
                        </td>

                        <td th:text="${patient.fullName}"></td>

                        <td th:text="${patient.gender}"></td>

                        <td th:text="${patient.phone}"></td>

                        <td th:text="${patient.email != null && !patient.email.isEmpty() ? patient.email : 'N/A'}"></td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="6"
                            class="text-center text-muted py-4">
                            No patients registered yet.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
