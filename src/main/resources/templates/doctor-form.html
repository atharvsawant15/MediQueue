
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">MediQueue</a>
        <a href="/doctors" class="btn btn-outline-light">View Doctors</a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Doctor Registration</h3>
        </div>

        <div class="card-body">

            <div th:if="${errorMessage}"
                 class="alert alert-danger"
                 th:text="${errorMessage}">
            </div>

            <form th:action="@{/doctors/save}"
                  th:object="${doctor}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{fullName}"
                               class="form-control"
                               placeholder="Enter doctor name">
                        <small class="text-danger"
                               th:errors="*{fullName}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}"
                               class="form-control"
                               placeholder="doctor@example.com">
                        <small class="text-danger"
                               th:errors="*{email}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" th:field="*{phone}"
                               class="form-control"
                               maxlength="10"
                               placeholder="10-digit phone number">
                        <small class="text-danger"
                               th:errors="*{phone}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specialization</label>
                        <select th:field="*{specialization}"
                                class="form-select">
                            <option value="">Select Specialization</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="Dermatology">Dermatology</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Gynecology">Gynecology</option>
                            <option value="ENT">ENT</option>
                        </select>
                        <small class="text-danger"
                               th:errors="*{specialization}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" th:field="*{department}"
                               class="form-control"
                               placeholder="Enter department">
                        <small class="text-danger"
                               th:errors="*{department}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Qualification</label>
                        <input type="text" th:field="*{qualification}"
                               class="form-control"
                               placeholder="Example: MBBS, MD">
                        <small class="text-danger"
                               th:errors="*{qualification}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Experience (Years)</label>
                        <input type="number" th:field="*{experienceYears}"
                               class="form-control"
                               min="0" max="60">
                        <small class="text-danger"
                               th:errors="*{experienceYears}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Consultation Fee (₹)</label>
                        <input type="number" th:field="*{consultationFee}"
                               class="form-control"
                               min="0.01" step="0.01">
                        <small class="text-danger"
                               th:errors="*{consultationFee}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Days</label>
                        <input type="text" th:field="*{availableDays}"
                               class="form-control"
                               placeholder="Monday, Wednesday, Friday">
                        <small class="text-danger"
                               th:errors="*{availableDays}"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Time</label>
                        <input type="text" th:field="*{availableTime}"
                               class="form-control"
                               placeholder="09:00 AM - 01:00 PM">
                        <small class="text-danger"
                               th:errors="*{availableTime}"></small>
                    </div>

                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        Register Doctor
                    </button>

                    <a href="/doctors" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
