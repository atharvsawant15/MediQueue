
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments | MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7f9;
        }

        .navbar {
            background: #0f766e;
        }

        .table-card {
            border: none;
            border-radius: 14px;
        }

        .table thead {
            background: #e6f4f1;
        }

        .btn-primary {
            background: #0f766e;
            border-color: #0f766e;
        }

        .btn-primary:hover {
            background: #115e59;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            MediQueue
        </a>

        <a th:href="@{/}" class="btn btn-light btn-sm">
            Home
        </a>

    </div>
</nav>

<div class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                Appointment Management
            </h2>

            <p class="text-muted mb-0">
                View and manage hospital appointments.
            </p>
        </div>

        <a th:href="@{/appointments/new}"
           class="btn btn-primary mt-3 mt-md-0">
            + Book Appointment
        </a>

    </div>

    <div class="card table-card shadow-sm">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Appointment No.</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date & Time</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Update Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="appointment : ${appointments}">

                        <td class="fw-semibold"
                            th:text="${appointment.appointmentNumber}">
                        </td>

                        <td>
                            <div class="fw-semibold"
                                 th:text="${appointment.patient.fullName}">
                            </div>

                            <small class="text-muted"
                                   th:text="${appointment.patient.patientCode}">
                            </small>
                        </td>

                        <td>
                            <div class="fw-semibold"
                                 th:text="${appointment.doctor.fullName}">
                            </div>

                            <small class="text-muted"
                                   th:text="${appointment.doctor.specialization}">
                            </small>
                        </td>

                        <td th:text="${#temporals.format(appointment.appointmentDateTime, 'dd-MM-yyyy HH:mm')}">
                        </td>

                        <td>
                            <span th:text="${appointment.reason}">
                            </span>
                        </td>

                        <td>

                            <span th:if="${appointment.status.name() == 'BOOKED'}"
                                  class="badge bg-primary">
                                BOOKED
                            </span>

                            <span th:if="${appointment.status.name() == 'COMPLETED'}"
                                  class="badge bg-success">
                                COMPLETED
                            </span>

                            <span th:if="${appointment.status.name() == 'CANCELLED'}"
                                  class="badge bg-danger">
                                CANCELLED
                            </span>

                        </td>

                        <td>

                            <form th:action="@{/appointments/{id}/status(id=${appointment.id})}"
                                  method="post"
                                  class="d-flex gap-2">

                                <select name="status"
                                        class="form-select form-select-sm">

                                    <option value="BOOKED"
                                            th:selected="${appointment.status.name() == 'BOOKED'}">
                                        Booked
                                    </option>

                                    <option value="COMPLETED"
                                            th:selected="${appointment.status.name() == 'COMPLETED'}">
                                        Completed
                                    </option>

                                    <option value="CANCELLED"
                                            th:selected="${appointment.status.name() == 'CANCELLED'}">
                                        Cancelled
                                    </option>

                                </select>

                                <button type="submit"
                                        class="btn btn-sm btn-outline-primary">
                                    Update
                                </button>

                            </form>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(appointments)}">

                        <td colspan="7"
                            class="text-center py-5 text-muted">

                            <h5>No Appointments Found</h5>

                            <p class="mb-3">
                                Start by booking your first appointment.
                            </p>

                            <a th:href="@{/appointments/new}"
                               class="btn btn-primary">
                                Book Appointment
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
