
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration | MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #123b63;
        }

        .registration-card {
            max-width: 850px;
            margin: 45px auto;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .card-header {
            background: #123b63;
            color: white;
            padding: 22px;
            border-radius: 15px 15px 0 0 !important;
        }

        .form-label {
            font-weight: 600;
            color: #344054;
        }

        .btn-primary {
            background: #1769aa;
            border: none;
            padding: 11px 25px;
        }

        .btn-primary:hover {
            background: #104c80;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            MediQueue
        </a>

        <a th:href="@{/patients}"
           class="btn btn-outline-light btn-sm">
            Patient Directory
        </a>
    </div>
</nav>

<div class="container">

    <div class="card registration-card">

        <div class="card-header">
            <h3 class="mb-1">Patient Registration</h3>
            <p class="mb-0">
                Register a new patient in the MediQueue system
            </p>
        </div>

        <div class="card-body p-4 p-md-5">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/patients/save}"
                  th:object="${patient}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-12">
                        <label class="form-label">Full Name *</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{fullName}"
                               placeholder="Enter patient's full name">

                        <div class="text-danger small"
                             th:errors="*{fullName}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date of Birth *</label>

                        <input type="date"
                               class="form-control"
                               th:field="*{dateOfBirth}">

                        <div class="text-danger small"
                             th:errors="*{dateOfBirth}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Gender *</label>

                        <select class="form-select"
                                th:field="*{gender}">

                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>

                        </select>

                        <div class="text-danger small"
                             th:errors="*{gender}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number *</label>

                        <input type="tel"
                               class="form-control"
                               th:field="*{phone}"
                               maxlength="10"
                               placeholder="10-digit mobile number">

                        <div class="text-danger small"
                             th:errors="*{phone}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>

                        <input type="email"
                               class="form-control"
                               th:field="*{email}"
                               placeholder="example@email.com">

                        <div class="text-danger small"
                             th:errors="*{email}">
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Residential Address *</label>

                        <textarea class="form-control"
                                  th:field="*{address}"
                                  rows="3"
                                  placeholder="Enter complete address">
                        </textarea>

                        <div class="text-danger small"
                             th:errors="*{address}">
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex flex-wrap gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Register Patient
                    </button>

                    <a th:href="@{/patients}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
