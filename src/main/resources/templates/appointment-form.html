
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | MediQueue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f9;
        }

        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .page-title {
            color: #0f766e;
            font-weight: 700;
        }

        .btn-primary {
            background-color: #0f766e;
            border-color: #0f766e;
        }

        .btn-primary:hover {
            background-color: #115e59;
            border-color: #115e59;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark" style="background-color: #0f766e;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">MediQueue</a>
        <a href="/appointments" class="btn btn-light btn-sm">
            View Appointments
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="mb-4">
                <h2 class="page-title">Book New Appointment</h2>
                <p class="text-muted">
                    Enter the details below to schedule a patient appointment.
                </p>
            </div>

            <div class="card main-card">
                <div class="card-body p-4 p-md-5">

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         th:text="${errorMessage}">
                    </div>

                    <form th:action="@{/appointments/save}"
                          th:object="${appointment}"
                          method="post">

                        <div class="mb-4">
                            <label class="form-label">Select Patient</label>

                            <select name="patientId"
                                    class="form-select"
                                    required>
                                <option value="">-- Select Patient --</option>

                                <option th:each="patient : ${patients}"
                                        th:value="${patient.id}"
                                        th:text="${patient.patientCode + ' - ' + patient.fullName}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Select Doctor</label>

                            <select name="doctorId"
                                    class="form-select"
                                    required>
                                <option value="">-- Select Doctor --</option>

                                <option th:each="doctor : ${doctors}"
                                        th:value="${doctor.id}"
                                        th:text="${doctor.doctorCode + ' - ' + doctor.fullName + ' (' + doctor.specialization + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Appointment Date and Time
                            </label>

                            <input type="datetime-local"
                                   th:field="*{appointmentDateTime}"
                                   class="form-control"
                                   required>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('appointmentDateTime')}"
                                 th:errors="*{appointmentDateTime}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Reason / Symptoms</label>

                            <textarea th:field="*{reason}"
                                      class="form-control"
                                      rows="4"
                                      maxlength="500"
                                      placeholder="Describe the reason for the appointment..."
                                      required>
                            </textarea>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('reason')}"
                                 th:errors="*{reason}">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                Book Appointment
                            </button>

                            <a href="/appointments"
                               class="btn btn-outline-secondary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
